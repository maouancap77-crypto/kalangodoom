<style>

<body>

</div>
<div id="hint">W/S Mover · A/D Virar · Q/E Deslizar · Mouse Mirar · Clique Atirar · 1 2 3 Armas · Shift Correr · ESC Pausar</div>
<script>
"use strict";
const RW=320,RH=200,DW=960,DH=600;
const FOV=Math.PI/3,HALF_FOV=FOV/2;
const TEX_SIZE=64,MAX_DEPTH=22;
const cv=document.getElementById('cv');
cv.width=DW;cv.height=DH;
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const buf=document.createElement('canvas');
buf.width=RW;buf.height=RH;
const bctx=buf.getContext('2d');
const imgData=bctx.createImageData(RW,RH);
const px=imgData.data;

const audioSettings={musicVolume:.3,sfxVolume:.45,musicMuted:false,sfxMuted:false};
function applyAudioSettings(){if(musicGain)musicGain.gain.value=audioSettings.musicMuted?0:audioSettings.musicVolume;if(sfxGain)sfxGain.gain.value=audioSettings.sfxMuted?0:audioSettings.sfxVolume;}

let AC=null,masterGain=null,distNode=null,musicGain=null,sfxGain=null;
let musicScheduler=null,currentTrack='menu',comicMusicScheduler=null;

function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=AC.createGain();masterGain.gain.value=.5;masterGain.connect(AC.destination);
  distNode=AC.createWaveShaper();
  const dc=1024,curve=new Float32Array(dc);
  for(let i=0;i<dc;i++){const x=i/(dc-1)*2-1;curve[i]=Math.tanh(x*3.5);}
  distNode.curve=curve;distNode.oversample='4x';
  musicGain=AC.createGain();musicGain.gain.value=audioSettings.musicMuted?0:audioSettings.musicVolume;
  distNode.connect(musicGain);musicGain.connect(masterGain);
  sfxGain=AC.createGain();sfxGain.gain.value=audioSettings.sfxMuted?0:audioSettings.sfxVolume;sfxGain.connect(masterGain);
}
function playKick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.01,t+.15);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.2);}
function playSnare(t){const n=AC.createBufferSource(),b=AC.createBuffer(1,4410,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2000;const g=AC.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.01,t+.1);n.connect(f);f.connect(g);g.connect(musicGain);n.start(t);}
function playHat(t){const n=AC.createBufferSource(),b=AC.createBuffer(1,2200,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.01,t+.04);n.connect(f);f.connect(g);g.connect(musicGain);n.start(t);}
function playBass(t,freq,dur){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=freq;f.type='lowpass';f.frequency.value=400;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+dur);o.connect(f);f.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+.05);}
function playGuitar(t,freq,dur){const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=freq;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.01,t+dur);o.connect(g);g.connect(distNode);o.start(t);o.stop(t+dur+.05);}

function startComicMusic() {
  if (!AC) return;
  const notes = [523, 659, 783, 659, 523, 587, 698, 587]; 
  const t = AC.currentTime;
  notes.forEach((f, i) => {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f * 0.5, t + i * 0.15);
    o.frequency.exponentialRampToValueAtTime(f, t + i * 0.15 + 0.05);
    g.gain.setValueAtTime(0, t + i * 0.15);
    g.gain.linearRampToValueAtTime(0.12, t + i * 0.15 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.14);
    o.connect(g);
    g.connect(musicGain);
    o.start(t + i * 0.15);
    o.stop(t + i * 0.15 + 0.15);
  });
  const bassNotes = [130, 130, 196, 196];
  bassNotes.forEach((f, i) => {
     const o = AC.createOscillator();
     const g = AC.createGain();
     o.type = 'sawtooth';
     o.frequency.value = f;
     g.gain.setValueAtTime(0.08, t + i * 0.3);
     g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.3 + 0.28);
     o.connect(g); g.connect(musicGain);
     o.start(t + i * 0.3); o.stop(t + i * 0.3 + 0.3);
  });
  comicMusicScheduler = setTimeout(startComicMusic, 1300);
}
function stopComicMusic(){if(comicMusicScheduler){clearTimeout(comicMusicScheduler);comicMusicScheduler=null;}}
function playFunnyTalk(duration) {
  if(!AC||audioSettings.sfxMuted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  const f = AC.createBiquadFilter();
  o.type = 'sawtooth';
  f.type = 'bandpass';
  f.frequency.value = 800;
  f.Q.value = 5;
  o.connect(f);
  f.connect(g);
  g.connect(sfxGain);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  let time = t;
  while(time < t + duration) {
    o.frequency.setValueAtTime(100 + Math.random() * 400, time);
    f.frequency.setValueAtTime(500 + Math.random() * 1000, time);
    time += 0.08 + Math.random() * 0.05;
  }
  o.start(t);
  o.stop(t + duration);
}

const N={E2:82.41,A2:110,B2:123.47,D3:146.83,E3:164.81,G3:196,A3:220,B3:246.94,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,E5:659.25,G5:783.99,A5:880,B5:987.77,D5:587.33};
function scheduleMusic(){
  if(!AC)return;
  const bpm=currentTrack==='boss'?165:currentTrack==='menu'?95:145;
  const spb=60/bpm,now=AC.currentTime,barStart=now+.05;
  const bassPattern=currentTrack==='menu'?[[N.E2,0,spb*2],[N.B2,spb*2,spb],[N.G3,spb*3,spb]]:[[N.E2,0,spb*.75],[N.E2,spb*.75,spb*.25],[N.E2,spb*1.5,spb*.5],[N.E2,spb*2,spb*.5],[N.E2,spb*2.5,spb*.5],[N.B2,spb*3,spb*.5],[N.A2,spb*3.5,spb*.5]];
  const guitarPattern=currentTrack==='menu'?[[N.E5,0,spb],[N.B4,spb,spb*.5],[N.G4,spb*1.5,spb*.5],[N.E5,spb*2,spb*2]]:[[N.E5,0,spb*.5],[N.B5,spb*.5,spb*.5],[N.E5,spb*1,spb*.5],[N.B5,spb*1.5,spb*.5],[N.E5,spb*2,spb*.5],[N.G5,spb*2.5,spb*.5],[N.A5,spb*3,spb*.5],[N.B5,spb*3.5,spb*.5]];
  bassPattern.forEach(([f,s,d])=>playBass(barStart+s,f,d));
  guitarPattern.forEach(([f,s,d])=>playGuitar(barStart+s,f,d));
  if(currentTrack!=='menu'){for(let b=0;b<4;b++){const bt=barStart+b*spb;playKick(bt);playKick(bt+spb*.5);if(b%2===1)playSnare(bt);playHat(bt);playHat(bt+spb*.25);playHat(bt+spb*.5);playHat(bt+spb*.75);}}
  else{playKick(barStart);playKick(barStart+spb*2);for(let i=0;i<8;i++)playHat(barStart+i*spb*.5);}
  musicScheduler=setTimeout(scheduleMusic,spb*4*1000);
}
function startMusic(track){currentTrack=track;if(musicScheduler)clearTimeout(musicScheduler);if(AC)scheduleMusic();}
function stopMusic(){if(musicScheduler){clearTimeout(musicScheduler);musicScheduler=null;}}
function sfx(type){
  if(!AC||audioSettings.sfxMuted)return;
  const t=AC.currentTime;
  switch(type){
    case'shoot':{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(60,t+.08);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.1);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.15);break;}
    case'shotgun':{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(30,t+.18);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.01,t+.22);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.28);const n=AC.createBufferSource(),b=AC.createBuffer(1,2200,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const ng=AC.createGain();ng.gain.setValueAtTime(.35,t);ng.gain.exponentialRampToValueAtTime(.01,t+.12);n.connect(ng);ng.connect(sfxGain);n.start(t);break;}
    case'mg':{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(80,t+.04);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.01,t+.05);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.06);break;}
    case'enemyhit':{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(350,t);o.frequency.exponentialRampToValueAtTime(90,t+.06);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.01,t+.08);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.1);break;}
    case'death':{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(25,t+.4);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.01,t+.45);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.5);const n=AC.createBufferSource(),b=AC.createBuffer(1,3000,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);n.buffer=b;const ng=AC.createGain();ng.gain.setValueAtTime(.25,t);ng.gain.exponentialRampToValueAtTime(.01,t+.3);n.connect(ng);ng.connect(sfxGain);n.start(t);break;}
    case'gib':{const n=AC.createBufferSource(),b=AC.createBuffer(1,1500,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);n.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=800;const g=AC.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);n.connect(f);f.connect(g);g.connect(sfxGain);n.start(t);break;}
    case'pickup':{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.linearRampToValueAtTime(1046,t+.12);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.18);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.2);break;}
    case'weapon':{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(600,t+.2);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.01,t+.25);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.3);break;}
    case'bossroar':{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(35,t+.6);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.01,t+.7);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.8);const o2=AC.createOscillator(),g2=AC.createGain();o2.type='square';o2.frequency.setValueAtTime(45,t);o2.frequency.exponentialRampToValueAtTime(20,t+.6);g2.gain.setValueAtTime(.3,t);g2.gain.exponentialRampToValueAtTime(.01,t+.7);o2.connect(g2);g2.connect(sfxGain);o2.start(t);o2.stop(t+.8);break;}
    case'hurt':{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(50,t+.15);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.01,t+.2);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.25);break;}
    case'wallhit':{const n=AC.createBufferSource(),b=AC.createBuffer(1,800,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);n.buffer=b;const g=AC.createGain();g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.01,t+.06);n.connect(g);g.connect(sfxGain);n.start(t);break;}
    case'door':{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(100,t);o.frequency.linearRampToValueAtTime(50,t+.3);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.01,t+.35);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+.4);break;}
  }
}

const textures=[];
function genTex(type){
  const d=new Uint8ClampedArray(TEX_SIZE*TEX_SIZE*4);
  for(let y=0;y<TEX_SIZE;y++)for(let x=0;x<TEX_SIZE;x++){
    const i=(y*TEX_SIZE+x)*4;let r,g,b;const n1=Math.random()*.2-.1,n2=Math.random()*.15-.075;
    switch(type){
      case 1:r=175+n1*45;g=105+n1*30;b=55+n1*18;if(y%16===0||(x+Math.floor(y/16)*16)%32===0){r*=.4;g*=.4;b*=.4;}if(Math.random()<.04){r=225;g=185;b=90;}if(Math.random()<.02){r=120;g=70;b=30;}break;
      case 2:r=45+n1*35;g=85+n1*45;b=38+n1*22;if(y%12===0||x%20===0){r*=.3;g*=.5;b*=.3;}if(Math.random()<.06){g=130+Math.random()*40;r=65;b=55;}if(Math.random()<.03){r=80;g=50;b=25;}break;
      case 3:r=75+n1*45;g=25+n1*18;b=18+n1*12;if(Math.random()<.05){r=210;g=70;b=25;}if(y%8===0){r*=.5;g*=.5;b*=.5;}if(Math.random()<.03){r=30;g=10;b=5;}break;
      case 4:r=85+n2*25;g=85+n2*25;b=95+n2*25;if(x<3||x>60||y<3||y>60){r=35;g=35;b=45;}if(y===32||y===31){r=210;g=160;b=55;}for(let by=10;by<54;by+=12){if(Math.abs(y-by)<2&&x>10&&x<54){r=50;g=50;b=60;}}break;
      default:r=100;g=100;b=100;
    }
    d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));d[i+3]=255;
  }
  return d;
}
for(let i=0;i<5;i++)textures.push(genTex(i+1));
const floorTex=new Uint8ClampedArray(TEX_SIZE*TEX_SIZE*4);
const ceilTex=new Uint8ClampedArray(TEX_SIZE*TEX_SIZE*4);
for(let y=0;y<TEX_SIZE;y++)for(let x=0;x<TEX_SIZE;x++){const i=(y*TEX_SIZE+x)*4;const n=Math.random()*.3-.15;floorTex[i]=55+n*30;floorTex[i+1]=35+n*20;floorTex[i+2]=20+n*10;floorTex[i+3]=255;if((x+y)%20<2){floorTex[i]*=.5;floorTex[i+1]*=.5;floorTex[i+2]*=.5;}ceilTex[i]=25+n*15;ceilTex[i+1]=15+n*10;ceilTex[i+2]=10+n*5;ceilTex[i+3]=255;}

const spriteCache={};
function makeSprite(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');draw(cx,w,h);return c;}
function drawLizard(cx,w,h,frame,dead){
  cx.clearRect(0,0,w,h);const fy=dead?Math.min(frame*.5,8):Math.sin(frame*.15)*2;const rot=dead?Math.min(frame*.08,Math.PI/2):0;
  cx.save();cx.translate(w/2,h*.6);cx.rotate(rot);cx.translate(-w/2,-h*.6);
  cx.fillStyle='#1a5a1a';cx.beginPath();cx.moveTo(w*.2,h*.55);cx.lineTo(w*.02,h*.62+fy);cx.lineTo(w*.05,h*.72);cx.lineTo(w*.22,h*.65);cx.fill();
  cx.fillStyle='#226a22';cx.fillRect(w*.3,h*.72,w*.1,h*.16);cx.fillRect(w*.58,h*.72,w*.1,h*.16);
  cx.fillStyle='#111';cx.fillRect(w*.3,h*.88,w*.03,h*.04);cx.fillRect(w*.37,h*.88,w*.03,h*.04);cx.fillRect(w*.58,h*.88,w*.03,h*.04);cx.fillRect(w*.65,h*.88,w*.03,h*.04);
  const bg=cx.createLinearGradient(w*.2,h*.4,w*.8,h*.7);bg.addColorStop(0,'#3aaa3a');bg.addColorStop(1,'#1a6a1a');cx.fillStyle=bg;
  cx.beginPath();cx.ellipse(w/2,h*.55,w*.32,h*.24,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#2a8a2a';cx.beginPath();cx.ellipse(w/2,h*.65,w*.22,h*.15,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a5a1a';for(let i=0;i<8;i++)cx.fillRect(w*(.2+i*.04),h*.45,w*.02,h*.08);
  const hg=cx.createLinearGradient(w*.6,h*.3,w*.8,h*.5);hg.addColorStop(0,'#4abb4a');hg.addColorStop(1,'#2a7a2a');cx.fillStyle=hg;
  cx.beginPath();cx.ellipse(w*.7,h*.4+fy,w*.19,h*.16,0,0,Math.PI*2);cx.fill();
  if(!dead){cx.fillStyle='#000';cx.beginPath();cx.arc(w*.76,h*.36+fy,4,0,Math.PI*2);cx.fill();cx.fillStyle='#ff0';cx.beginPath();cx.arc(w*.76,h*.36+fy,3,0,Math.PI*2);cx.fill();cx.fillStyle='#f00';cx.beginPath();cx.arc(w*.76,h*.36+fy,1.5,0,Math.PI*2);cx.fill();}
  else{cx.fillStyle='#600';cx.beginPath();cx.arc(w*.76,h*.36+fy,3,0,Math.PI*2);cx.fill();}
  cx.fillStyle='#000';cx.fillRect(w*.72,h*.42+fy,w*.12,h*.04);
  cx.fillStyle='#fff';cx.fillRect(w*.73,h*.42+fy,w*.02,h*.03);cx.fillRect(w*.78,h*.42+fy,w*.02,h*.03);cx.fillRect(w*.83,h*.42+fy,w*.02,h*.03);
  cx.restore();
}
function drawSnake(cx,w,h,frame,dead){
  cx.clearRect(0,0,w,h);const fy=dead?0:Math.sin(frame*.2)*4;const wobble=dead?0:Math.sin(frame*.3)*.05;
  const bg=cx.createLinearGradient(0,h*.4,0,h*.8);bg.addColorStop(0,'#9B7B55');bg.addColorStop(1,'#5C4033');cx.strokeStyle=bg;cx.lineWidth=w*.13;cx.lineCap='round';
  cx.beginPath();cx.moveTo(w*.2,h*.85);cx.bezierCurveTo(w*.1+h*wobble*20,h*.65,w*.4,h*.5,w*.35,h*.4);cx.bezierCurveTo(w*.3,h*.3,w*.6,h*.35,w*.65,h*.25+fy);cx.stroke();
  cx.strokeStyle='#3C2815';cx.lineWidth=w*.04;cx.beginPath();cx.moveTo(w*.2,h*.85);cx.bezierCurveTo(w*.1,h*.65,w*.4,h*.5,w*.35,h*.4);cx.stroke();

function renderSprites(){

function getEnemySprite(e){const key=e.type+'_'+Math.floor(e.animFrame)+'_'+(e.dead?'d'+Math.floor(e.deathTimer*5):'')+'_'+(e.type==='boss'?(e.attackType||''):'');if(spriteCache[key])return spriteCache[key];let w=64,h=64;if(e.type==='boss'){w=128;h=128;}const c=makeSprite(w,h,(cx,cw,ch)=>{switch(e.type){case'lizard':drawLizard(cx,cw,ch,e.animFrame,e.dead);break;case'snake':drawSnake(cx,cw,ch,e.animFrame,e.dead);break;case'jaguar':drawJaguar(cx,cw,ch,e.animFrame,e.dead);break;case'boss':drawBoss(cx,cw,ch,e.animFrame,e.dead,e.attackType);break;}});return c;}

function updatePlayer(dt){
  gameTime+=dt;updateDoors(dt);
  const speed=(keys['shift']?4.5:2.8)*dt;const rotSpeed=2.2*dt;
  if(keys['arrowleft']||keys['a']||keys['auto_left'])player.angle-=rotSpeed;
  if(keys['arrowright']||keys['d']||keys['auto_right'])player.angle+=rotSpeed;
  let mx=0,my=0;
  if(keys['w']||keys['arrowup']){mx+=Math.cos(player.angle)*speed;my+=Math.sin(player.angle)*speed;}
  if(keys['s']||keys['arrowdown']){mx-=Math.cos(player.angle)*speed;my-=Math.sin(player.angle)*speed;}
  if(keys['q']){mx+=Math.cos(player.angle-Math.PI/2)*speed;my+=Math.sin(player.angle-Math.PI/2)*speed;}
  if(keys['e']){mx+=Math.cos(player.angle+Math.PI/2)*speed;my+=Math.sin(player.angle+Math.PI/2)*speed;}
  const moving=(mx!==0||my!==0);if(moving)player.moveBob+=dt*(keys['shift']?12:8);
  const nx=player.x+mx;if(!isWall(nx+Math.sign(mx)*.15,player.y))player.x=nx;
  const ny=player.y+my;if(!isWall(player.x,ny+Math.sign(my)*.15))player.y=ny;
  if(player.fireAnim>0)player.fireAnim-=dt*6;
  if(player.fireCooldown>0)player.fireCooldown-=dt;
  if(player.hurtFlash>0)player.hurtFlash-=dt*3;
  if(player.pickupFlash>0)player.pickupFlash-=dt*3;
  if(player.comboTimer>0){player.comboTimer-=dt;if(player.comboTimer<=0)player.killCombo=0;}
  for(let i=damageDirections.length-1;i>=0;i--){damageDirections[i].life-=dt*2;if(damageDirections[i].life<=0)damageDirections.splice(i,1);}
  if(mouse.down&&player.fireCooldown<=0)fireWeapon();
  if(keys['1']&&player.weapons.pistol)player.currentWeapon='pistol';
  if(keys['2']&&player.weapons.shotgun)player.currentWeapon='shotgun';
  if(keys['3']&&player.weapons.mg)player.currentWeapon='mg';
  for(let i=items.length-1;i>=0;i--){const it=items[i];const d=Math.sqrt((it.x-player.x)**2+(it.y-player.y)**2);if(d<.5){if(it.type==='exit'&&currentLevel<2){loadLevel(currentLevel+1);return;}if(it.type==='health'){player.hp=Math.min(player.maxHp,player.hp+30);sfx('pickup');player.pickupFlash=1;items.splice(i,1);spawnParticles(it.x,it.y,'#0f0',12);}else if(it.type==='shotgun'){player.weapons.shotgun=true;player.ammo.shotgun+=16;player.currentWeapon='shotgun';sfx('weapon');player.pickupFlash=1;items.splice(i,1);spawnParticles(it.x,it.y,'#fa0',12);}else if(it.type==='mg'){player.weapons.mg=true;player.ammo.mg+=80;player.currentWeapon='mg';sfx('weapon');player.pickupFlash=1;items.splice(i,1);spawnParticles(it.x,it.y,'#0af',12);}}}
  if(screenShake>0)screenShake-=dt*3;
}

// ============ WEAPONS & HITSCAN ============
function fireWeapon(){const w=player.currentWeapon;switch(w){case'pistol':player.fireCooldown=.2;player.fireAnim=1;sfx('shoot');hitscan(28,2.5,0);break;case'shotgun':if(player.ammo.shotgun<=0){player.currentWeapon='pistol';return;}player.ammo.shotgun--;player.fireCooldown=.55;player.fireAnim=1;screenShake=.4;sfx('shotgun');for(let i=0;i<7;i++)hitscan(22,1.8,(i-3)*.07);break;case'mg':if(player.ammo.mg<=0){player.currentWeapon='pistol';return;}player.ammo.mg--;player.fireCooldown=.07;player.fireAnim=1;sfx('mg');hitscan(18,3.5,(Math.random()-.5)*.04);break;}}
function hitscan(damage,range,spread){const angle=player.angle+spread;const dx=Math.cos(angle),dy=Math.sin(angle);let closestDist=range,hitEnemy=null,hitPoint={x:player.x+dx*range,y:player.y+dy*range};for(const e of enemies){if(e.dead)continue;const edx=e.x-player.x,edy=e.y-player.y;const t=edx*dx+edy*dy;if(t<0||t>range)continue;const px2=player.x+dx*t,py2=player.y+dy*t;const distToEnemy=Math.sqrt((px2-e.x)**2+(py2-e.y)**2);const enemySize=e.type==='boss'?.9:.45;if(distToEnemy<enemySize&&t<closestDist){closestDist=t;hitEnemy=e;hitPoint={x:px2,y:py2};}}let wallDist=range;let stepX=player.x,stepY=player.y;for(let i=0;i<range*12;i++){stepX+=dx*.08;stepY+=dy*.08;if(isWall(stepX,stepY)){wallDist=Math.sqrt((stepX-player.x)**2+(stepY-player.y)**2);hitPoint={x:stepX,y:stepY};break;}}tracers.push({x1:player.x+Math.cos(player.angle)*.3,y1:player.y+Math.sin(player.angle)*.3,x2:hitPoint.x,y2:hitPoint.y,life:.06});if(hitEnemy&&closestDist<wallDist){const distFalloff=1-closestDist/(range*2);const dmg=Math.floor(damage*Math.max(.4,distFalloff));hitEnemy.hp-=dmg;hitEnemy.hitFlash=.25;hitEnemy.state='chase';if(hitEnemy.type!=='boss')hitEnemy.retreatTimer=.3;sfx('enemyhit');const bloodColor=hitEnemy.type==='snake'?'#9B5050':hitEnemy.type==='jaguar'?'#C08020':'#2a8a2a';spawnParticles(hitEnemy.x,hitEnemy.y,bloodColor,10);spawnParticles(hitEnemy.x,hitEnemy.y,'#600',5);const kbx=dx*.15,kby=dy*.15;if(!isWall(hitEnemy.x+kbx,hitEnemy.y))hitEnemy.x+=kbx;if(!isWall(hitEnemy.x,hitEnemy.y+kby))hitEnemy.y+=kby;if(hitEnemy.hp<=0)killEnemy(hitEnemy,dx,dy);}else{sfx('wallhit');spawnParticles(hitPoint.x,hitPoint.y,'#aaa',6);spawnParticles(hitPoint.x,hitPoint.y,'#666',4);decals.push({x:hitPoint.x,y:hitPoint.y,type:'floor',color:'rgba(80,70,60,.5)',life:5});}}
function killEnemy(e,kdx,kdy){
  e.dead=true;e.deathTimer=0;killCount++;player.killCombo++;player.comboTimer=2;sfx('death');if(player.currentWeapon==='shotgun'||e.type==='boss')sfx('gib');
  const bloodColor=e.type==='snake'?'#8B4530':e.type==='jaguar'?'#B07010':e.type==='boss'?'#1a5a1a':'#2a7a2a';spawnParticles(e.x,e.y,bloodColor,25);spawnParticles(e.x,e.y,'#600',15);spawnParticles(e.x,e.y,'#300',8);for(let i=0;i<8;i++)particles.push({x:e.x,y:e.y,dx:(Math.random()-.5)*5+kdx*2,dy:(Math.random()-.5)*5+kdy*2,life:1+Math.random()*.5,maxLife:1.5,color:Math.random()<.5?bloodColor:'#600',size:2+Math.random()*2});decals.push({x:e.x,y:e.y,type:'floor',color:'rgba(80,10,5,.6)',life:8});decals.push({x:e.x+.2,y:e.y,type:'floor',color:'rgba(60,5,0,.4)',life:7});screenShake=Math.max(screenShake,e.type==='boss'?.8:.2);
  
  if(e.type === 'boss') {
    setTimeout(() => {
      if(gameState === 'playing') {
        gameState = 'victory';
        victoryTime = 0;
        stopMusic();
        startComicMusic();
        playFunnyTalk(5.5);
        setTimeout(() => { if(gameState === 'victory') playFunnyTalk(3.5); }, 6000);
      }
    }, 2500);
  }
}

// ============ ENEMIES & BOSS ============
function updateEnemies(dt){for(const e of enemies){e.animFrame++;if(e.hitFlash>0)e.hitFlash-=dt*5;if(e.dead){e.deathTimer+=dt;continue;}if(e.type==='boss'){updateBoss(e,dt);continue;}const dx=player.x-e.x,dy=player.y-e.y;const dist=Math.sqrt(dx*dx+dy*dy);if(e.state==='idle'){if(dist<10&&hasLOS(e.x,e.y,player.x,player.y))e.state='chase';}if(e.retreatTimer>0){e.retreatTimer-=dt;const rx=-dx/dist,ry=-dy/dist;const moveX=rx*e.speed*1.5*dt,moveY=ry*e.speed*1.5*dt;if(!isWall(e.x+moveX,e.y))e.x+=moveX;if(!isWall(e.x,e.y+moveY))e.y+=moveY;}else if(e.state==='chase'){e.strafeTimer-=dt;if(e.strafeTimer<=0){e.strafeTimer=1+Math.random()*1.5;e.strafeDir*=-1;}if(dist>e.attackRange){const moveX=(dx/dist)*e.speed*dt;const moveY=(dy/dist)*e.speed*dt;if(e.type!=='lizard'){const perpX=-dy/dist*e.strafeDir*.5*dt*e.speed;const perpY=dx/dist*e.strafeDir*.5*dt*e.speed;if(!isWall(e.x+moveX+perpX,e.y))e.x+=moveX+perpX;if(!isWall(e.x,e.y+moveY+perpY))e.y+=moveY+perpY;}else{if(!isWall(e.x+moveX,e.y))e.x+=moveX;if(!isWall(e.x,e.y+moveY))e.y+=moveY;}}else{e.attackTimer-=dt;if(e.attackTimer<=0){e.attackTimer=e.type==='snake'?.6:e.type==='jaguar'?.8:1.2;if(hasLOS(e.x,e.y,player.x,player.y)){player.hp-=e.damage;player.hurtFlash=1;screenShake=Math.max(screenShake,.4);sfx('hurt');const ang=Math.atan2(dy,dx);damageDirections.push({angle:ang,life:1});spawnParticles(player.x+Math.cos(player.angle)*.5,player.y+Math.sin(player.angle)*.5,'#f00',6);}}}}if(player.hp<=0 && gameState==='playing'){gameState='dying';deathTimer=0;screenShake=.8;stopMusic();playFunnyTalk(2.5);sfx('gib');spawnParticles(player.x,player.y,'#f00',30);spawnParticles(player.x,player.y,'#600',20);}}}

function updateBoss(boss,dt){
  const dx=player.x-boss.x,dy=player.y-boss.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  boss.phase=boss.hp>boss.maxHp*.66?1:boss.hp>boss.maxHp*.33?2:3;
  // Boss mais lento em todas as fases
  const phaseSpeed=[.5, 0.8, 1.2][boss.phase-1];
  // Mais intervalo entre ataques para dar tempo de respirar
  const phaseAttackCD=[4.5, 3.5, 2.5][boss.phase-1];
  
  if(boss.telegraph>0){
    boss.telegraph-=dt;
    if(boss.telegraph<=0){executeBossAttack(boss);boss.attackTimer=phaseAttackCD;boss.attackType=null;}
    return;
  }
  
  boss.attackTimer-=dt;
  
  if(dist>3.5){
    const moveX=(dx/dist)*phaseSpeed*dt;
    const moveY=(dy/dist)*phaseSpeed*dt;
    if(!isWall(boss.x+moveX,boss.y))boss.x+=moveX;
    if(!isWall(boss.x,boss.y+moveY))boss.y+=moveY;
  }
  
  if(boss.attackTimer<=0&&dist<12){
    const attacks=boss.phase===1?['tongue','charge']:boss.phase===2?['tongue','charge','poison']:['tongue','charge','poison','summon'];
    boss.attackType=attacks[Math.floor(Math.random()*attacks.length)];
    // Telegraph mais longo: 1.6s para desviar com facilidade
    boss.telegraph=1.6; 
    sfx('bossroar');
  }
  
  if(boss.phase===3){
    boss.summonTimer-=dt;
    if(boss.summonTimer<=0){
      boss.summonTimer=10; // Invoca menos frequentemente
      for(let i=0;i<2;i++){
        const ang=Math.random()*Math.PI*2;
        const sx=boss.x+Math.cos(ang)*2.5,sy=boss.y+Math.sin(ang)*2.5;
        if(!isWall(sx,sy))enemies.push(makeEnemy('lizard',sx,sy));
      }
    }
  }
}

function executeBossAttack(boss){
  const dx=player.x-boss.x,dy=player.y-boss.y;
  const ang=Math.atan2(dy,dx);
  switch(boss.attackType){
    case'tongue':
      // Projéteis mais lentos
      for(let i=0;i<3;i++)setTimeout(()=>{if(!boss.dead)projectiles.push({x:boss.x,y:boss.y,dx:Math.cos(ang)*4,dy:Math.sin(ang)*4,damage:18,type:'tongue',life:3});},i*150);
      break;
    case'poison':
      // Leque mais aberto e projéteis mais lentos
      for(let i=-3;i<=3;i++){
        const a=ang+i*.2;
        projectiles.push({x:boss.x,y:boss.y,dx:Math.cos(a)*2.5,dy:Math.sin(a)*2.5,damage:12,type:'poison',life:4});
      }
      break;
    case'charge':
      const chargeDist=6;
      const tx=boss.x+Math.cos(ang)*chargeDist;
      const ty=boss.y+Math.sin(ang)*chargeDist;
      const steps=25; // Mais passos = animação mais suave e coreografada
      for(let i=0;i<steps;i++){
        const t=i/steps;
        const cx=boss.x+(tx-boss.x)*t;
        const cy=boss.y+(ty-boss.y)*t;
        // Investida mais lenta: i*30ms
        setTimeout(()=>{
          if(!isWall(cx,cy)){boss.x=cx;boss.y=cy;}
          spawnParticles(cx,cy,'#1a3a1a',3);
          if(Math.sqrt((cx-player.x)**2+(cy-player.y)**2)<1.2){
            player.hp-=28;player.hurtFlash=1;screenShake=.7;sfx('hurt');
            const a2=Math.atan2(player.y-cy,player.x-cx);
            damageDirections.push({angle:a2+Math.PI,life:1});
          }
        },i*30);
      }
      break;
    case'summon':
      for(let i=0;i<3;i++){
        const a=Math.random()*Math.PI*2;
        const sx=boss.x+Math.cos(a)*2.5,sy=boss.y+Math.sin(a)*2.5;
        if(!isWall(sx,sy))enemies.push(makeEnemy('lizard',sx,sy));
      }
      spawnParticles(boss.x,boss.y,'#0a0',20);
      break;
  }
}

function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.dx*dt;p.y+=p.dy*dt;p.life-=dt;if(Math.random()<.3)spawnParticles(p.x,p.y,p.type==='poison'?'#6f0':'#f0a',2);if(p.life<=0||isWall(p.x,p.y)){spawnParticles(p.x,p.y,p.type==='poison'?'#6f0':'#f0a',6);projectiles.splice(i,1);continue;}const d=Math.sqrt((p.x-player.x)**2+(p.y-player.y)**2);if(d<.4 && gameState==='playing'){player.hp-=p.damage;player.hurtFlash=1;screenShake=.3;sfx('hurt');const ang=Math.atan2(p.dy,p.dx);damageDirections.push({angle:ang,life:1});spawnParticles(player.x,player.y,p.type==='poison'?'#6f0':'#f0a',8);projectiles.splice(i,1);}}}
function spawnParticles(x,y,color,count){for(let i=0;i<count;i++)particles.push({x,y,dx:(Math.random()-.5)*4,dy:(Math.random()-.5)*4,life:.4+Math.random()*.6,maxLife:1,color,size:1+Math.random()*2});}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.dx*dt;p.y+=p.dy*dt;p.dx*=.92;p.dy*=.92;p.life-=dt;if(p.life<=0)particles.splice(i,1);}for(let i=tracers.length-1;i>=0;i--){tracers[i].life-=dt*15;if(tracers[i].life<=0)tracers.splice(i,1);}for(let i=decals.length-1;i>=0;i--){decals[i].life-=dt*.1;if(decals[i].life<=0)decals.splice(i,1);}}

  initAudio();if(AC&&AC.state==='suspended')AC.resume();

    const rect=cv.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(DW/rect.width);
    const my=(e.clientY-rect.top)*(DH/rect.height);
    for(const btn of pauseButtons){
      if(mx>=btn.x&&mx<=btn.x+btn.w&&my>=btn.y&&my<=btn.y+btn.h){
        if(btn.action) btn.action();
        break;
      }
    }

document.addEventListener('mouseleave',()=>{lastClientX=-1;});
cv.addEventListener('mousedown',e=>{
  if(gameState==='paused'){const rect=cv.getBoundingClientRect();const mx=(e.clientX-rect.left)*(DW/rect.width);const my=(e.clientY-rect.top)*(DH/rect.height);for(const btn of pauseButtons){if(mx>=btn.x&&mx<=btn.x+btn.w&&my>=btn.y&&my<=btn.y+btn.h){if(btn.isVol){dragVol=btn.isVol;}break;}}}
  else if(gameState==='playing'){if(e.button===0)mouse.down=true;}
});
window.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;dragVol=null;});
function startGame(){gameState='playing';killCount=0;loadLevel(0);}
function restartGame(){gameState='playing';killCount=0;player.hp=100;stopComicMusic();loadLevel(0);}

let lastTime=performance.now();
function loop(time){
  const dt=Math.min(.05,(time-lastTime)/1000);lastTime=time;
  if(gameState==='playing'){updatePlayer(dt);if(gameState==='playing'){updateEnemies(dt);updateProjectiles(dt);updateParticles(dt);}}
  else if(gameState==='dying'){updateParticles(dt);deathTimer+=dt;if(deathTimer>4){gameState='gameover';}}
  else if(gameState==='victory') victoryTime+=dt;
  
  if(gameState==='playing'||gameState==='paused'||gameState==='gameover'||gameState==='dying'){
    renderScene();
    if(gameState!=='paused')renderSprites();
    renderHUD();
    if(gameState==='dying')renderDyingScreen();
    if(gameState==='paused')renderPauseMenu();
  }
  else if(gameState==='menu')renderMenu();
  else if(gameState==='gameover'){renderScene();renderSprites();renderHUD();renderGameOver();}
  else if(gameState==='victory')renderVictory();
  requestAnimationFrame(loop);
}
renderMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
